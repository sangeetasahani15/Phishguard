<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhishGuard – Email Fraud Detector</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mu:#94a3b8;--ac:#38bdf8}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:28px 16px;text-align:center}h1{margin:0;font-size:2rem}header p{color:var(--mu);margin:8px 0 0}
main{max-width:1000px;margin:0 auto;padding:0 16px 40px;display:grid;gap:20px;grid-template-columns:1fr 1fr}
@media(max-width:800px){main{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:14px;padding:20px}
label{display:block;font-size:.85rem;color:var(--mu);margin:12px 0 4px}
input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:var(--tx);font:inherit}
textarea{min-height:170px;resize:vertical}
button{margin-top:14px;padding:11px 18px;border:0;border-radius:8px;font-weight:600;cursor:pointer;background:var(--ac);color:#04283a}
button.alt{background:#334155;color:var(--tx);margin-left:8px}
.gauge{text-align:center}.num{font-size:3.6rem;font-weight:800}.bar{height:12px;background:#0f172a;border-radius:8px;overflow:hidden;margin:10px 0}
.bar div{height:100%;width:0;transition:width .6s}
.safe{color:#4ade80}.low{color:#facc15}.high{color:#fb923c}.critical{color:#f87171}
.bsafe{background:#4ade80}.blow{background:#facc15}.bhigh{background:#fb923c}.bcritical{background:#f87171}
ul{list-style:none;padding:0;margin:0}li{padding:10px;border-radius:8px;background:#0f172a;margin-top:8px;font-size:.9rem;display:flex;justify-content:space-between;gap:10px}
li b{color:#f87171;white-space:nowrap}.tag{color:var(--ac);font-size:.75rem;display:block}
.mu{color:var(--mu);font-size:.85rem}
</style></head><body>
<header><h1>🛡️ PhishGuard</h1><p>Email fraud &amp; phishing detector with a 0–100 risk score</p></header>
<main>
<section class="card">
<label for="sender">Sender (e.g. Name &lt;mail@domain.com&gt;)</label><input id="sender" placeholder="PayPal Support <help@paypa1-secure.xyz>">
<label for="subject">Subject</label><input id="subject" placeholder="URGENT: Your account is suspended">
<label for="body">Email body</label><textarea id="body" placeholder="Paste the email content here..."></textarea>
<button id="go">Analyze Email</button><button class="alt" id="demo">Load fraud sample</button><button class="alt" id="safe">Load safe sample</button>
</section>
<section class="card gauge">
<div class="mu">Risk Score</div><div class="num" id="score">--</div>
<div class="bar"><div id="fill"></div></div><h2 id="verdict">Waiting for input</h2>
<p class="mu" id="eng">Fill in the form and click Analyze.</p>
<ul id="list"></ul>
</section>
</main>
<script>
var URG=["urgent","immediately","act now","within 24 hours","expires","suspended","final notice","verify now","last warning","account locked","limited time","action required"];
var CRED=["password","otp","one-time","ssn","social security","bank account","credit card","cvv","pin number","gift card","wire transfer","bitcoin","routing number"];
var PRIZE=["you won","winner","lottery","prize","claim your","free gift","congratulations","inheritance","million"];
var SHORT=["bit.ly","tinyurl.com","t.co","goo.gl","ow.ly","is.gd","cutt.ly","rb.gy"];
var TLDS=[".xyz",".top",".click",".tk",".ml",".ga",".cf",".gq",".work",".zip",".country"];
var FREE=["gmail.com","yahoo.com","outlook.com","hotmail.com","aol.com","proton.me"];
var BRANDS=["paypal","amazon","microsoft","google","apple","netflix","bank","hdfc","sbi","icici","paytm","irs","fedex","dhl"];
var LOOK=["paypa1","micros0ft","g00gle","amaz0n","arnazon","faceb00k","netfliix","app1e","rnicrosoft"];
var BADEXT=[".exe",".scr",".js",".bat",".vbs",".jar",".zip",".html"];
function localAnalyze(sender,subject,body){
 sender=String(sender||"");subject=String(subject||"");body=String(body||"");
 var text=(subject+" "+body).toLowerCase(),f=[];
 function add(c,m,p){f.push({category:c,message:m,points:p});}
 function hits(a){return a.filter(function(w){return text.indexOf(w)>-1;});}
 var h=hits(URG);if(h.length)add("Language","Urgency / pressure wording: "+h.slice(0,4).join(", "),Math.min(25,8*h.length));
 h=hits(CRED);if(h.length)add("Language","Asks for sensitive information: "+h.slice(0,4).join(", "),Math.min(25,10*h.length));
 h=hits(PRIZE);if(h.length)add("Language","Prize / lottery bait: "+h.slice(0,3).join(", "),15);
 if(/\b(dear (customer|user|client|member)|valued customer)\b/.test(text))add("Language","Generic greeting instead of your name",5);
 var all=subject+body,letters=all.replace(/[^A-Za-z]/g,"");
 if(letters.length>30&&letters.replace(/[^A-Z]/g,"").length/letters.length>0.4)add("Style","Excessive ALL-CAPS text",5);
 if((all.match(/!/g)||[]).length>=3)add("Style","Excessive exclamation marks",5);
 var urls=(body.match(/(?:https?:\/\/|www\.)[^\s<>"')]+/gi)||[]).slice(0,10);
 urls.forEach(function(u){
  var ul=u.toLowerCase(),host=ul.replace(/^(https?:\/\/)?(www\.)?/,"").split("/")[0].split(":")[0];
  var auth=ul.split("//").slice(-1)[0].split("/")[0];
  if(/^\d{1,3}(\.\d{1,3}){3}$/.test(host))add("Links","Link uses a raw IP address: "+u.slice(0,60),20);
  else if(SHORT.indexOf(host)>-1)add("Links","URL shortener hides destination: "+host,12);
  else if(host.indexOf("xn--")>-1||auth.indexOf("@")>-1)add("Links","Deceptive link structure: "+u.slice(0,60),15);
  else if(TLDS.some(function(t){return host.endsWith(t);}))add("Links","Suspicious domain ending: "+host,10);
  if(ul.indexOf("http://")===0)add("Links","Unencrypted (http) link: "+u.slice(0,60),5);
 });
 var sl=sender.toLowerCase(),m=sl.match(/[\w.+-]+@([\w.-]+)/),dom=m?m[1]:"";
 if(sender.trim()&&!m)add("Sender","Sender address is not a valid email",10);
 if(LOOK.some(function(l){return sl.indexOf(l)>-1||text.indexOf(l)>-1;}))add("Sender","Look-alike brand spelling detected (e.g. paypa1)",25);
 var name=sl.split("<")[0];
 if(dom){
  for(var i=0;i<BRANDS.length;i++){var b=BRANDS[i];if(name.indexOf(b)>-1&&dom.indexOf(b)<0){add("Sender","Display name claims '"+b+"' but domain is "+dom,25);break;}}
  if(FREE.indexOf(dom)>-1&&BRANDS.slice(0,6).some(function(b){return text.indexOf(b)>-1;}))add("Sender","Brand mentioned but sent from free email service ("+dom+")",15);
  if(TLDS.some(function(t){return dom.endsWith(t);}))add("Sender","Sender domain has suspicious ending: "+dom,10);
 }
 for(var j=0;j<BADEXT.length;j++){var e=BADEXT[j];if(new RegExp("[\\w-]+"+e.replace(".","\\.")+"\\b").test(text)){add("Attachment","Risky attachment type mentioned: "+e,15);break;}}
 var s=Math.min(100,f.reduce(function(a,x){return a+x.points;},0)),v,c;
 if(s<25){v="Likely Safe";c="safe";}else if(s<50){v="Suspicious";c="low";}else if(s<75){v="Likely Phishing";c="high";}else{v="Fraud / Phishing";c="critical";}
 return {score:s,verdict:v,level:c,findings:f,engine:"browser-engine"};
}
function $(id){return document.getElementById(id);}
function render(r){
 $("score").textContent=r.score;$("score").className="num "+r.level;
 $("fill").style.width=r.score+"%";$("fill").className="b"+r.level;
 $("verdict").textContent=r.verdict;$("verdict").className=r.level;
 $("eng").textContent="Analyzed by: "+r.engine+" · "+r.findings.length+" red flag(s)";
 var ul=$("list");ul.innerHTML="";
 if(!r.findings.length){var li=document.createElement("li");li.textContent="No red flags detected.";ul.appendChild(li);}
 r.findings.forEach(function(x){var li=document.createElement("li"),d=document.createElement("div"),t=document.createElement("span"),b=document.createElement("b");
  t.className="tag";t.textContent=x.category;d.appendChild(t);d.appendChild(document.createTextNode(x.message));b.textContent="+"+x.points;li.appendChild(d);li.appendChild(b);ul.appendChild(li);});
}
function analyze(){
 var p={sender:$("sender").value,subject:$("subject").value,body:$("body").value};
 if(!p.sender.trim()&&!p.subject.trim()&&!p.body.trim()){$("eng").textContent="Please enter some email content first.";return;}
 var done=false;
 function local(){if(!done){done=true;render(localAnalyze(p.sender,p.subject,p.body));}}
 try{
  var ctl=typeof AbortController!=="undefined"?new AbortController():null;
  var timer=setTimeout(function(){if(ctl)ctl.abort();local();},4000);
  fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p),signal:ctl?ctl.signal:undefined})
   .then(function(res){if(!res.ok)throw new Error("bad");return res.json();})
   .then(function(r){clearTimeout(timer);if(!done){if(typeof r.score!=="number")throw new Error("bad");done=true;render(r);}})
   .catch(function(){clearTimeout(timer);local();});
 }catch(e){local();}
}
$("go").onclick=analyze;
$("demo").onclick=function(){$("sender").value="PayPal Support <help@paypa1-secure.xyz>";$("subject").value="URGENT: Account suspended - verify now!!!";$("body").value="Dear customer, your account is locked. Verify now at http://192.168.4.7/login and enter your password and OTP within 24 hours. Congratulations, you are a winner! Open invoice.exe";};
$("safe").onclick=function(){$("sender").value="Priya Sharma <priya@mycompany.com>";$("subject").value="Meeting notes";$("body").value="Hi Rahul, sharing the notes from today's meeting. Details at https://mycompany.com/notes. Thanks!";};
</script></body></html>
